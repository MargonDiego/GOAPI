basePath: /api/v1
definitions:
  handlers.AssignPermissionsRequest:
    properties:
      permission_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - permission_ids
    type: object
  handlers.AssignRolesRequest:
    properties:
      role_ids:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  handlers.AuthRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret1234
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: rand_base64_string
        type: string
    type: object
  handlers.BulkAssignRolesRequest:
    properties:
      role_ids:
        example:
        - 4
        - 5
        items:
          type: integer
        type: array
      user_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - role_ids
    - user_ids
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret1234
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      message:
        example: user registered successfully
        type: string
    type: object
  handlers.PaginatedPermissionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.PermissionResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PaginatedRoleResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PaginatedUserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PermissionCreateRequest:
    properties:
      description:
        example: Allows reading posts
        maxLength: 500
        type: string
      name:
        example: read:posts
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  handlers.PermissionResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        example: rand_base64_string
        minLength: 1
        type: string
    required:
    - refresh_token
    type: object
  handlers.RoleCreateRequest:
    properties:
      description:
        example: Can edit content
        maxLength: 500
        type: string
      name:
        example: Editor
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  handlers.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/handlers.PermissionResponse'
        type: array
    type: object
  handlers.RoleUpdateRequest:
    properties:
      description:
        example: Can edit content
        maxLength: 500
        type: string
      name:
        example: Editor
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    type: object
  handlers.UserResponse:
    properties:
      id:
        type: integer
      roles:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      username:
        type: string
    type: object
