basePath: /api/v1
definitions:
  application.Expediente:
    properties:
      adjuntos:
        items:
          $ref: '#/definitions/domain.Adjunto'
        type: array
      apelaciones:
        items:
          $ref: '#/definitions/domain.Apelacion'
        type: array
      comentarios:
        items:
          $ref: '#/definitions/domain.Comentario'
        type: array
      descargos:
        items:
          $ref: '#/definitions/domain.Descargo'
        type: array
      eventos:
        items:
          $ref: '#/definitions/domain.IncidenciaEvento'
        type: array
      incidencia:
        $ref: '#/definitions/domain.Incidencia'
      medidas:
        items:
          $ref: '#/definitions/domain.Medida'
        type: array
      notificaciones:
        items:
          $ref: '#/definitions/domain.Notificacion'
        type: array
      resoluciones:
        items:
          $ref: '#/definitions/domain.Resolucion'
        type: array
    type: object
  domain.Adjunto:
    properties:
      createdAt:
        type: string
      hashSHA256:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      mimeType:
        type: string
      nombreAlmacenado:
        type: string
      nombreOriginal:
        type: string
      subidoPorID:
        type: integer
      tamanoBytes:
        format: int64
        type: integer
    type: object
  domain.Apelacion:
    properties:
      createdAt:
        type: string
      estado:
        $ref: '#/definitions/domain.EstadoApelacion'
      fechaPresentacion:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      motivo:
        type: string
      plazoVencimiento:
        type: string
      presentadaPorID:
        type: integer
      resolucionID:
        type: integer
    type: object
  domain.CategoriaIncidencia:
    enum:
    - maltrato_entre_estudiantes
    - maltrato_adulto_estudiante
    - ciberacoso
    - vulneracion_derechos
    - connotacion_sexual
    - porte_arma
    - consumo
    - otro
    type: string
    x-enum-varnames:
    - CategoriaMaltratoEstudiantes
    - CategoriaMaltratoAdulto
    - CategoriaCiberacoso
    - CategoriaVulneracion
    - CategoriaConnotacionSexual
    - CategoriaPorteArma
    - CategoriaConsumo
    - CategoriaOtro
  domain.ClaseMedida:
    enum:
    - FORMATIVA
    - DISCIPLINARIA
    type: string
    x-enum-varnames:
    - ClaseFormativa
    - ClaseDisciplinaria
  domain.Comentario:
    properties:
      autorID:
        type: integer
      createdAt:
        type: string
      cuerpo:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
    type: object
  domain.Descargo:
    properties:
      contenido:
        type: string
      createdAt:
        type: string
      fechaPresentacion:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      presentadoPorID:
        type: integer
    type: object
  domain.EstadoApelacion:
    enum:
    - PENDIENTE
    - ACEPTADA
    - RECHAZADA
    type: string
    x-enum-varnames:
    - ApelacionPendiente
    - ApelacionAceptada
    - ApelacionRechazada
  domain.EstadoCumplimiento:
    enum:
    - PENDIENTE
    - EN_CURSO
    - CUMPLIDA
    - INCUMPLIDA
    type: string
    x-enum-varnames:
    - CumplimientoPendiente
    - CumplimientoEnCurso
    - CumplimientoCumplida
    - CumplimientoIncumplida
  domain.EstadoIncidencia:
    enum:
    - RECIBIDA
    - EN_INVESTIGACION
    - RESUELTA
    - EN_APELACION
    - RESOLUCION_FINAL
    - EN_SEGUIMIENTO
    - CERRADA
    - DERIVADA
    type: string
    x-enum-varnames:
    - EstadoRecibida
    - EstadoEnInvestigacion
    - EstadoResuelta
    - EstadoEnApelacion
    - EstadoResolucionFinal
    - EstadoEnSeguimiento
    - EstadoCerrada
    - EstadoDerived
  domain.GravedadIncidencia:
    enum:
    - LEVE
    - GRAVE
    - GRAVISIMA
    type: string
    x-enum-varnames:
    - GravedadLeve
    - GravedadGrave
    - GravedadGravisima
  domain.Incidencia:
    properties:
      categoria:
        $ref: '#/definitions/domain.CategoriaIncidencia'
      codigo:
        type: string
      denuncianteID:
        type: integer
      descripcion:
        type: string
      esConstitutivoDeDelito:
        type: boolean
      estado:
        $ref: '#/definitions/domain.EstadoIncidencia'
      estudianteID:
        type: integer
      fechaCierre:
        type: string
      fechaEliminacionProgramada:
        type: string
      fechaInicioInvestigacion:
        type: string
      fechaRecepcion:
        type: string
      fechaSuspensionPreventiva:
        type: string
      gravedad:
        $ref: '#/definitions/domain.GravedadIncidencia'
      id:
        type: integer
      responsableID:
        type: integer
      scope:
        type: string
      suspensionPreventiva:
        type: boolean
      titulo:
        type: string
    type: object
  domain.IncidenciaEvento:
    properties:
      actorID:
        type: integer
      createdAt:
        type: string
      estadoAnterior:
        $ref: '#/definitions/domain.EstadoIncidencia'
      estadoNuevo:
        $ref: '#/definitions/domain.EstadoIncidencia'
      id:
        type: integer
      incidenciaID:
        type: integer
      resumen:
        type: string
      tipo:
        $ref: '#/definitions/domain.TipoEvento'
    type: object
  domain.Medida:
    properties:
      clase:
        $ref: '#/definitions/domain.ClaseMedida'
      createdAt:
        type: string
      descripcion:
        type: string
      estadoCumplimiento:
        $ref: '#/definitions/domain.EstadoCumplimiento'
      fechaInicio:
        type: string
      fechaTermino:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      proporcionalidad:
        type: string
      responsableEjecucionID:
        type: integer
      tipo:
        $ref: '#/definitions/domain.TipoMedida'
    type: object
  domain.Notificacion:
    properties:
      acuse:
        type: boolean
      contenido:
        type: string
      createdAt:
        type: string
      destinatario:
        type: string
      fechaAcuse:
        type: string
      fechaNotificacion:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      medio:
        type: string
    type: object
  domain.Resolucion:
    properties:
      createdAt:
        type: string
      decision:
        type: string
      fechaResolucion:
        type: string
      fundamentacion:
        type: string
      id:
        type: integer
      incidenciaID:
        type: integer
      resueltoPorID:
        type: integer
      tipo:
        $ref: '#/definitions/domain.TipoResolucion'
    type: object
  domain.TipoEvento:
    enum:
    - CREACION
    - CAMBIO_ESTADO
    - ASIGNACION
    - COMENTARIO
    - ADJUNTO
    - MEDIDA
    - DESCARGO
    - RESOLUCION
    - APELACION
    - NOTIFICACION
    type: string
    x-enum-varnames:
    - EventoCreacion
    - EventoCambioEstado
    - EventoAsignacion
    - EventoComentario
    - EventoAdjunto
    - EventoMedida
    - EventoDescargo
    - EventoResolucion
    - EventoApelacion
    - EventoNotificacion
  domain.TipoMedida:
    enum:
    - dialogo
    - servicio
    - suspension
    - condicionalidad
    - cancelacion
    - expulsion
    type: string
    x-enum-varnames:
    - TipoDialogo
    - TipoServicioComunitario
    - TipoSuspension
    - TipoCondicionalidad
    - TipoCancelacion
    - TipoExpulsion
  domain.TipoResolucion:
    enum:
    - ORIGINAL
    - APELACION
    type: string
    x-enum-varnames:
    - ResolucionOriginal
    - ResolucionApelacion
  handlers.APIMeta:
    properties:
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.APIResponse:
    properties:
      code:
        description: 'CÃ³digo de error de dominio (ej: "USER_NOT_FOUND")'
        type: string
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/handlers.APIMeta'
      success:
        type: boolean
    type: object
  handlers.AgregarComentarioRequest:
    properties:
      cuerpo:
        minLength: 1
        type: string
    required:
    - cuerpo
    type: object
  handlers.AsignarRequest:
    properties:
      responsable_id:
        type: integer
    required:
    - responsable_id
    type: object
  handlers.AssignPermissionsRequest:
    properties:
      permission_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - permission_ids
    type: object
  handlers.AssignRolesRequest:
    properties:
      role_ids:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  handlers.AuthRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret1234
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: rand_base64_string
        type: string
    type: object
  handlers.BulkAssignRolesRequest:
    properties:
      role_ids:
        example:
        - 4
        - 5
        items:
          type: integer
        type: array
      user_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - role_ids
    - user_ids
    type: object
  handlers.CreateEstudianteRequest:
    properties:
      curso:
        example: 8°B
        maxLength: 50
        minLength: 1
        type: string
      nombre:
        example: Juan Pérez
        maxLength: 120
        minLength: 2
        type: string
      rut:
        example: 12.345.678-5
        type: string
    required:
    - curso
    - nombre
    - rut
    type: object
  handlers.CreateIncidenciaRequest:
    properties:
      categoria:
        type: string
      descripcion:
        type: string
      es_constitutivo_de_delito:
        type: boolean
      estudiante_id:
        type: integer
      gravedad:
        enum:
        - LEVE
        - GRAVE
        - GRAVISIMA
        type: string
      titulo:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - categoria
    - descripcion
    - estudiante_id
    - gravedad
    - titulo
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret1234
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  handlers.EstudianteResponse:
    properties:
      curso:
        type: string
      id:
        type: integer
      nombre:
        type: string
      rut:
        type: string
    type: object
  handlers.IncidenciaResponse:
    properties:
      categoria:
        type: string
      codigo:
        type: string
      denunciante_id:
        type: integer
      descripcion:
        type: string
      es_constitutivo_de_delito:
        type: boolean
      estado:
        type: string
      estudiante_id:
        type: integer
      gravedad:
        type: string
      id:
        type: integer
      responsable_id:
        type: integer
      scope:
        type: string
      suspension_preventiva:
        type: boolean
      titulo:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      message:
        example: user registered successfully
        type: string
    type: object
  handlers.PaginatedPermissionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.PermissionResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PaginatedRoleResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PaginatedUserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserResponse'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.PermissionCreateRequest:
    properties:
      description:
        example: Allows reading posts
        maxLength: 500
        type: string
      name:
        example: read:posts
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  handlers.PermissionResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.PresentarApelacionRequest:
    properties:
      motivo:
        minLength: 10
        type: string
      plazo_vencimiento:
        type: string
      resolucion_id:
        type: integer
    required:
    - motivo
    - plazo_vencimiento
    - resolucion_id
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        example: rand_base64_string
        minLength: 1
        type: string
    required:
    - refresh_token
    type: object
  handlers.RegistrarDescargoRequest:
    properties:
      contenido:
        minLength: 10
        type: string
    required:
    - contenido
    type: object
  handlers.RegistrarMedidaRequest:
    properties:
      clase:
        enum:
        - FORMATIVA
        - DISCIPLINARIA
        type: string
      descripcion:
        minLength: 5
        type: string
      fecha_inicio:
        type: string
      fecha_termino:
        type: string
      proporcionalidad:
        minLength: 10
        type: string
      responsable_ejec_id:
        type: integer
      tipo:
        type: string
    required:
    - clase
    - descripcion
    - fecha_inicio
    - proporcionalidad
    - responsable_ejec_id
    - tipo
    type: object
  handlers.RegistrarNotificacionRequest:
    properties:
      contenido:
        minLength: 5
        type: string
      destinatario:
        type: string
      fecha:
        type: string
      medio:
        enum:
        - EMAIL
        - CARTA
        - TELEFONO
        - PRESENCIAL
        type: string
    required:
    - contenido
    - destinatario
    - fecha
    - medio
    type: object
  handlers.ResolverApelacionRequest:
    properties:
      aceptada:
        type: boolean
      decision:
        minLength: 5
        type: string
      fundamentacion:
        minLength: 10
        type: string
    required:
    - decision
    - fundamentacion
    type: object
  handlers.ResolverRequest:
    properties:
      decision:
        minLength: 5
        type: string
      fundamentacion:
        minLength: 10
        type: string
    required:
    - decision
    - fundamentacion
    type: object
  handlers.RoleCreateRequest:
    properties:
      description:
        example: Can edit content
        maxLength: 500
        type: string
      name:
        example: Editor
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  handlers.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/handlers.PermissionResponse'
        type: array
    type: object
  handlers.RoleUpdateRequest:
    properties:
      description:
        example: Can edit content
        maxLength: 500
        type: string
      name:
        example: Editor
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    type: object
  handlers.UpdateEstudianteRequest:
    properties:
      curso:
        maxLength: 50
        minLength: 1
        type: string
      nombre:
        maxLength: 120
        minLength: 2
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    type: object
  handlers.UserResponse:
    properties:
      id:
        type: integer
      roles:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST con autenticaciÃ³n JWT y control de permisos basado en roles.
  title: Clean Architecture Go API
  version: "1.0"
paths:
  /:
    get:
      description: Retorna nombre, version, estado y enlaces de la API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: API info
      tags:
      - system
  /estudiantes:
    get:
      parameters:
      - default: 1
        description: Página
        in: query
        name: page
        type: integer
      - default: 10
        description: Tamaño
        in: query
        name: size
        type: integer
      - description: Filtrar por curso
        in: query
        name: curso
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar estudiantes
      tags:
      - estudiantes
    post:
      consumes:
      - application/json
      description: Crea un estudiante (solo dato, no usuario). PII cifrada en reposo.
      parameters:
      - description: Datos del estudiante
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateEstudianteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear estudiante
      tags:
      - estudiantes
  /estudiantes/{id}:
    delete:
      parameters:
      - description: Estudiante ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Eliminar estudiante
      tags:
      - estudiantes
    get:
      parameters:
      - description: Estudiante ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.EstudianteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener estudiante
      tags:
      - estudiantes
    put:
      consumes:
      - application/json
      parameters:
      - description: Estudiante ID
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEstudianteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar estudiante
      tags:
      - estudiantes
  /estudiantes/{id}/restore:
    post:
      parameters:
      - description: Estudiante ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restaurar estudiante
      tags:
      - estudiantes
  /incidencias:
    get:
      parameters:
      - default: 1
        description: Página
        in: query
        name: page
        type: integer
      - default: 10
        description: Tamaño
        in: query
        name: size
        type: integer
      - description: Estado
        in: query
        name: estado
        type: string
      - description: Gravedad
        in: query
        name: gravedad
        type: string
      - description: Categoría
        in: query
        name: categoria
        type: string
      produces:
